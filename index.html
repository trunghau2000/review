       2. HELPER UTILITIES
       ========================================================================== */
    const formatPrice = (amount, currency = "VND") => {
      if (!amount || amount === 0) return "Miễn phí (Free)";
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
    };

    const parseInputUrlOrName = (input) => {
      const cleanInput = input.trim();
      if (!cleanInput) return { type: "UNKNOWN", query: "" };

      // Steam App URL check
      const steamMatch = cleanInput.match(/store\.steampowered\.com\/app\/(\d+)/i);
      if (steamMatch) {
        return { type: "STEAM_URL", appId: steamMatch[1], query: steamMatch[1] };
      }

      // Epic Games Store URL check
      const epicMatch = cleanInput.match(/epicgames\.com\/(?:[^\/]+\/)?p\/([a-zA-C0-9\-]+)/i);
      if (epicMatch) {
        return { type: "EPIC_URL", slug: epicMatch[1], query: epicMatch[1] };
      }

      return { type: "NAME", query: cleanInput };
    };

    /* Weight formula for Overall Game Score */
    const calculateOverallScore = (ratings) => {
      if (!ratings) return 0;
      const { gameplay = 0, story = 0, graphics = 0, audio = 0, performance = 0, replayability = 0, value = 0 } = ratings;
      const score = (gameplay * 0.20) + (story * 0.15) + (graphics * 0.10) + (audio * 0.10) + (performance * 0.15) + (replayability * 0.10) + (value * 0.20);
      return Math.min(10, Math.max(0, score)).toFixed(1);
    };

    /* Benchmark Estimator Hardware Database */
    const HARDWARE_TIERS = {
      cpu: {
        high: ["i7-13700", "i9", "7800x3d", "ryzen 9", "ryzen 7 7700", "i7-12700"],
        medium: ["i5-12400", "i5-11400", "ryzen 5 5600", "ryzen 5 3600", "i7-10700", "i5-10400"],
        low: ["i3", "ryzen 3", "i5-8400", "fx", "pentium"]
      },
      gpu: {
        ultra: ["4090", "4080", "7900 xtx", "4070 ti", "3090", "7900 xt"],
        high: ["4070", "3080", "3070", "6800 xt", "7800 xt", "4060 ti"],
        medium: ["3060", "2060", "6600", "1660 super", "4060", "3050", "rx 580", "gtx 1070"],
        low: ["gtx 1060", "gtx 1050", "gtx 970", "rx 570", "uhd graphics", "vega"]
      }
    };

    const estimatePerformance = (userSpecs, gameMinSpecs, gameRecSpecs) => {
      if (!userSpecs || !userSpecs.gpu || !userSpecs.ram) {
        return { level: "UNKNOWN", text: "Vui lòng nhập cấu hình PC để phân tích.", color: "text-slate-400", fps1080p: "--", fps1440p: "--", fps4k: "--" };
      }

      const ramGbs = parseInt(userSpecs.ram) || 8;
      const gpuText = (userSpecs.gpu || "").toLowerCase();
      const cpuText = (userSpecs.cpu || "").toLowerCase();

      let gpuScore = 2; // 1: low, 2: med, 3: high, 4: ultra
      if (HARDWARE_TIERS.gpu.ultra.some(g => gpuText.includes(g))) gpuScore = 4;
      else if (HARDWARE_TIERS.gpu.high.some(g => gpuText.includes(g))) gpuScore = 3;
      else if (HARDWARE_TIERS.gpu.medium.some(g => gpuText.includes(g))) gpuScore = 2;
      else if (HARDWARE_TIERS.gpu.low.some(g => gpuText.includes(g))) gpuScore = 1;

      let level = "GOOD";
      let statusText = "🟢 Tốt - Vận hành mượt mà ở độ phân giải 1080p/1440p";
      let color = "text-emerald-400";
      let fps1080p = "60+ FPS";
      let fps1440p = "45-60 FPS";
      let fps4k = "30 FPS";

      if (gpuScore >= 4 && ramGbs >= 16) {
        level = "EXCELLENT";
        statusText = "🟢 Tuyệt vời - Chiến mượt Ultra Settings 4K Ray-Tracing";
        color = "text-emerald-400";
        fps1080p = "120+ FPS";
        fps1440p = "90+ FPS";
        fps4k = "60+ FPS";
      } else if (gpuScore === 2 || ramGbs === 8) {
        level = "MEDIUM";
        statusText = "🟡 Có thể chơi tốt - Khuyên dùng thiết lập Medium 1080p";
        color = "text-amber-400";
        fps1080p = "45-60 FPS";
        fps1440p = "30 FPS";
        fps4k = "<20 FPS (Không khuyến nghị)";
      } else if (gpuScore === 1 || ramGbs < 8) {
        level = "LOW";
        statusText = "🟠 Cần giảm setting xuống Low - Có thể tụt FPS khi giao tranh nặng";
        color = "text-orange-400";
        fps1080p = "30-40 FPS";
        fps1440p = "<25 FPS";
        fps4k = "Unplayable";
      }

      return { level, text: statusText, color, fps1080p, fps1440p, fps4k };
    };

    /* ==========================================================================
       3. REACT MAIN APP COMPONENT
       ========================================================================== */
    function App() {
      const [searchQuery, setSearchQuery] = useState("");
      const [activeGame, setActiveGame] = useState(PRESET_GAMES_DATABASE[0]);
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");
      const [searchResults, setSearchResults] = useState([]);
      const [showSearchResults, setShowSearchResults] = useState(false);

      // System Specs State
      const [userSpecs, setUserSpecs] = useState({
        cpu: "Core i5-12400F",
        gpu: "RTX 3060 12GB",
        ram: "16",
        storage: "SSD",
        os: "Windows 11 64-bit"
      });

      // User Preferences State
      const [favorites, setFavorites] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("gah_favorites") || "[]");
        } catch { return []; }
      });

      const [searchHistory, setSearchHistory] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("gah_history") || "[]");
        } catch { return []; }
      });

      const [activeTab, setActiveTab] = useState("ANALYST"); // ANALYST, DISCOVER, FAVS, HISTORY
      const [showSpoiler, setShowSpoiler] = useState(false);
      const [showModalMsg, setShowModalMsg] = useState(null);

      // Save to localstorage
      useEffect(() => {
        localStorage.setItem("gah_favorites", JSON.stringify(favorites));
      }, [favorites]);

      useEffect(() => {
        localStorage.setItem("gah_history", JSON.stringify(searchHistory));
      }, [searchHistory]);

      const handleSearch = (e) => {
        if (e) e.preventDefault();
        if (!searchQuery.trim()) return;

        setIsLoading(true);
        setErrorMsg("");
        setShowSearchResults(false);

        const parsed = parseInputUrlOrName(searchQuery);

        setTimeout(() => {
          let matched = null;

          if (parsed.type === "STEAM_URL") {
            matched = PRESET_GAMES_DATABASE.find(g => g.steamAppId === parsed.appId);
          } else if (parsed.type === "EPIC_URL") {
            matched = PRESET_GAMES_DATABASE.find(g => g.epicSlug === parsed.slug);
          } else {
            // Search by Name
            const q = parsed.query.toLowerCase();
            const matches = PRESET_GAMES_DATABASE.filter(g => 
              g.name.toLowerCase().includes(q) || 
              g.fullTitle.toLowerCase().includes(q) ||
              g.genres.some(genre => genre.toLowerCase().includes(q))
            );

            if (matches.length === 1) {
              matched = matches[0];
            } else if (matches.length > 1) {
              setSearchResults(matches);
              setShowSearchResults(true);
              setIsLoading(false);
              return;
            }
          }

          if (matched) {
            setActiveGame(matched);
            setActiveTab("ANALYST");
            addToHistory(matched);
          } else {
            // Create dynamic fall-back search object if game isn't in database
            const dynamicGame = createDynamicGameData(parsed.query);
            setActiveGame(dynamicGame);
            setActiveTab("ANALYST");
            addToHistory(dynamicGame);
          }

          setIsLoading(false);
        }, 600);
      };

      const createDynamicGameData = (name) => {
        return {
          id: Date.now().toString(),
          steamAppId: "999999",
          epicSlug: name.toLowerCase().replace(/\s+/g, '-'),
          name: name,
          fullTitle: `${name} (Dữ liệu Live Store)`,
          coverImage: "https://placehold.co/600x350/1e293b/38bdf8?text=" + encodeURIComponent(name),
          backgroundImage: "https://placehold.co/1920x1080/0f172a/1e293b?text=" + encodeURIComponent(name),
          developer: "Chưa cập nhật",
          publisher: "Chưa cập nhật",
          releaseDate: "2024-2026",
          status: "Released",
          ageRating: "16+",
          platforms: { windows: true, macos: false, linux: false, console: true },
          genres: ["Action", "Adventure"],
          tags: ["Action", "Singleplayer"],
          steamPrice: { original: 750000, current: 750000, discount: 0, currency: "VND", isFree: false },
          epicPrice: { original: 750000, current: 750000, discount: 0, currency: "VND", isFree: false },
          playerModes: { singleplayer: true, multiplayer: false, coop: false, pvp: false, pve: true, maxPlayers: 1, controllerSupport: "Full" },
          story: {
            officialSummary: `Tóm tắt chính thức cho ${name} đang được truy xuất trực tiếp từ máy chủ Steam / Epic Games.`,
            analystAnalysis: `Phân tích AI: ${name} hứa hẹn mang tới trải nghiệm lối chơi mượt mà độc đáo.`,
            spoilerWarning: "Chưa có thông tin spoiler cho tựa game này."
          },
          gameplay: { combat: 8, exploration: 8, characterProgression: 8, loot: 7, crafting: 7, stealth: 6, shooting: 7, difficulty: "Medium", replayability: "Medium", overviewText: "Lối chơi kết hợp nhiều yếu tố hành động hấp dẫn." },
          systemRequirements: {
            minimum: { os: "Windows 10 64-bit", cpu: "Intel Core i5-8400", ram: "8 GB RAM", gpu: "GTX 1060 6GB", directx: "Version 12", storage: "50 GB SSD", notes: "1080p Low" },
            recommended: { os: "Windows 10/11 64-bit", cpu: "Intel Core i7-10700K", ram: "16 GB RAM", gpu: "RTX 3060 12GB", directx: "Version 12", storage: "50 GB SSD", notes: "1080p High" }
          },
          ratings: { graphics: 8.0, audio: 8.0, gameplay: 8.0, story: 7.5, performance: 8.0, replayability: 7.5, value: 8.0 },
          pros: ["Đồ họa ấn tượng", "Cốt truyện hấp dẫn", "Tối ưu hóa khá tốt"],
          cons: ["Giá thành còn cao", "Cần có cấu hình PC tầm trung trở lên"],
          suitableFor: ["Game thủ yêu thích thể loại Action/RPG"],
          notSuitableFor: ["Máy tính cấu hình quá yếu"],
          verdict: `Tựa game ${name} đáng để cân nhắc nếu bạn là fan của thể loại này.`,
          buyRecommendation: "RECOMMENDED",
          screenshots: ["https://placehold.co/1280x720/1e293b/ffffff?text=Screenshot+1"],
          trailerUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
          storeUrls: { steam: `https://store.steampowered.com/search/?term=${encodeURIComponent(name)}`, epic: `https://store.epicgames.com/en-US/browse?q=${encodeURIComponent(name)}` },
          lastUpdated: new Date().toLocaleString('vi-VN')
        };
      };

      const addToHistory = (game) => {
        setSearchHistory(prev => {
          const filtered = prev.filter(item => item.id !== game.id);
          return [{ id: game.id, name: game.name, cover: game.coverImage, date: new Date().toLocaleTimeString('vi-VN') }, ...filtered].slice(0, 10);
        });
      };

      const toggleFavorite = (game) => {
        if (favorites.some(f => f.id === game.id)) {
          setFavorites(favorites.filter(f => f.id !== game.id));
          setShowModalMsg("Đã xóa khỏi danh sách Yêu Thích!");
        } else {
          setFavorites([...favorites, { id: game.id, name: game.name, cover: game.coverImage, rating: calculateOverallScore(game.ratings) }]);
          setShowModalMsg("Đã thêm vào danh sách Yêu Thích!");
        }
      };

      const copyShareLink = () => {
        const url = window.location.href;
        document.execCommand && document.execCommand('copy');
        setShowModalMsg("Đã sao chép liên kết chia sẻ trang phân tích!");
      };

      const performanceEval = useMemo(() => {
        return estimatePerformance(userSpecs, activeGame.systemRequirements.minimum, activeGame.systemRequirements.recommended);
      }, [userSpecs, activeGame]);

      const overallScore = useMemo(() => calculateOverallScore(activeGame.ratings), [activeGame]);

      return (
        <div className="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100">
          
          {/* TOP NOTICE & HEADER */}
          <header className="sticky top-0 z-50 border-b border-slate-800 bg-slate-950/90 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
              
              {/* BRAND LOGO */}
              <div 
                className="flex items-center gap-3 cursor-pointer group"
                onClick={() => { setActiveTab("ANALYST"); }}
              >
                <div className="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-emerald-400 p-0.5 flex items-center justify-center shadow-lg shadow-cyan-500/20 group-hover:scale-105 transition-transform">
                  <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                    <i className="fa-solid fa-gamepad text-2xl text-cyan-400"></i>
                  </div>
                </div>
                <div>
                  <h1 className="font-black text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-emerald-400">
                    GAME ANALYST HUB
                  </h1>
                  <p className="text-[10px] font-semibold tracking-widest text-slate-400 uppercase">
                    TRUNG HẬU • GAME DATA ENGINE
                  </p>
                </div>
              </div>

              {/* NAVIGATION TABS */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-900/80 p-1.5 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActiveTab("ANALYST")}
                  className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 ${activeTab === 'ANALYST' ? 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  <i className="fa-solid fa-chart-line"></i> Phân Tích Game
                </button>
                <button
                  onClick={() => setActiveTab("DISCOVER")}
                  className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 ${activeTab === 'DISCOVER' ? 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  <i className="fa-solid fa-compass"></i> Khám Phá Game
                </button>
                <button
                  onClick={() => setActiveTab("FAVS")}
                  className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 ${activeTab === 'FAVS' ? 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  <i className="fa-solid fa-heart text-red-400"></i> Yêu Thích ({favorites.length})
                </button>
                <button
                  onClick={() => setActiveTab("HISTORY")}
                  className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 ${activeTab === 'HISTORY' ? 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  <i className="fa-solid fa-clock-rotate-left"></i> Lịch Sử
                </button>
              </nav>

              {/* CREATOR AUTHOR CREDIT BADGE */}
              <div className="flex items-center gap-3">
                <div className="hidden lg:flex flex-col items-end">
                  <span className="text-[11px] text-slate-400 font-medium">Created & Developed by</span>
                  <span className="text-xs font-bold text-cyan-400 flex items-center gap-1">
                    <i className="fa-solid fa-code text-[10px]"></i> Trung Hậu
                  </span>
                </div>
              </div>

            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            {/* HERO SEARCH BAR SECTION */}
            <section className="mb-10 text-center relative">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-950/60 border border-cyan-800/50 text-cyan-400 text-xs font-medium mb-4">
                <i className="fa-solid fa-bolt text-amber-400"></i> Hệ thống Tra cứu & Phân tích Game Trực Tuyến 2026
              </div>
              <h2 className="text-3xl sm:text-5xl font-black text-white tracking-tight max-w-3xl mx-auto leading-tight mb-3">
                Phân Tích Game. So Sánh Giá. Kiểm Tra Cấu Hình.
              </h2>
              <p className="text-sm sm:text-base text-slate-400 max-w-2xl mx-auto mb-8">
                Nhập tên game hoặc dán đường dẫn <span className="text-cyan-400 font-semibold">Steam Store</span> / <span className="text-blue-400 font-semibold">Epic Games Store</span> để nhận báo cáo phân tích chuyên sâu.
              </p>

              {/* SEARCH INPUT BOX */}
              <form onSubmit={handleSearch} className="max-w-3xl mx-auto relative">
                <div className="relative flex items-center rounded-2xl p-2 bg-slate-900 border-2 border-slate-800 focus-within:border-cyan-500 shadow-2xl transition-all">
                  <i className="fa-solid fa-magnifying-glass text-slate-400 text-lg ml-4 mr-2"></i>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Nhập tên game (ví dụ: Cyberpunk 2077) hoặc dán link Steam / Epic Games Store..."
                    className="w-full bg-transparent text-sm sm:text-base text-white placeholder-slate-500 focus:outline-none pr-32"
                  />
                  <button
                    type="submit"
                    disabled={isLoading}
                    className="absolute right-2 px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-xs sm:text-sm tracking-wide shadow-lg transition-all flex items-center gap-2 cursor-pointer disabled:opacity-50"
                  >
                    {isLoading ? (
                      <>
                        <i className="fa-solid fa-circle-notch animate-spin"></i> Đang Phân Tích...
                      </>
                    ) : (
                      <>
                        🔍 PHÂN TÍCH GAME
                      </>
                    )}
                  </button>
                </div>

                {/* SEARCH RESULTS SUGGESTION MODAL */}
                {showSearchResults && (
                  <div className="absolute top-full left-0 right-0 mt-2 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-50 text-left overflow-hidden">
                    <div className="p-3 bg-slate-800/80 text-xs text-slate-400 font-bold border-b border-slate-700 flex justify-between">
                      <span>CÓ PHẢI BẠN MUỐN TÌM:</span>
                      <button onClick={() => setShowSearchResults(false)} className="text-slate-400 hover:text-white">✕</button>
                    </div>
                    <div className="max-h-64 overflow-y-auto divide-y divide-slate-800">
                      {searchResults.map(game => (
                        <div
                          key={game.id}
                          onClick={() => {
                            setActiveGame(game);
                            setActiveTab("ANALYST");
                            setShowSearchResults(false);
                            addToHistory(game);
                          }}
                          className="p-3 hover:bg-slate-800 flex items-center gap-3 cursor-pointer transition-colors"
                        >
                          <img src={game.coverImage} className="w-16 h-10 object-cover rounded" alt={game.name} />
                          <div>
                            <p className="font-bold text-sm text-white">{game.name}</p>
                            <p className="text-xs text-slate-400">{game.genres.join(", ")} • {game.developer}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </form>

              {/* QUICK SUGGESTIONS */}
              <div className="mt-4 flex flex-wrap items-center justify-center gap-2 text-xs text-slate-400">
                <span className="font-semibold text-slate-500">Gợi ý nhanh:</span>
                {PRESET_GAMES_DATABASE.map(g => (
                  <button
                    key={g.id}
                    onClick={() => {
                      setActiveGame(g);
                      setActiveTab("ANALYST");
                      addToHistory(g);
                    }}
                    className="px-2.5 py-1 rounded-md bg-slate-900 border border-slate-800 hover:border-cyan-500 hover:text-cyan-400 transition-colors"
                  >
                    {g.name}
                  </button>
                ))}
              </div>
            </section>

            {/* TAB CONTENTS */}
            {activeTab === "ANALYST" && (
              <section className="space-y-8 animate-fadeIn">
                
                {/* 1. MAIN OVERVIEW BANNER CARD */}
                <div className="relative rounded-3xl overflow-hidden border border-slate-800 bg-slate-900 shadow-2xl">
                  {/* Background Backdrop Blur */}
                  <div className="absolute inset-0 z-0">
                    <img src={activeGame.backgroundImage} className="w-full h-full object-cover opacity-20 blur-md scale-105" alt="" />
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent"></div>
                  </div>

                  <div className="relative z-10 p-6 sm:p-8 grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
                    
                    {/* COVER POSTER */}
                    <div className="md:col-span-4 lg:col-span-3 space-y-4">
                      <div className="rounded-2xl overflow-hidden border-2 border-slate-700/60 shadow-2xl relative group">
                        <img src={activeGame.coverImage} className="w-full h-auto object-cover group-hover:scale-105 transition-transform duration-300" alt={activeGame.name} />
                        <div className="absolute top-3 left-3 bg-slate-950/80 backdrop-blur-md px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wider text-cyan-400 border border-cyan-800/50">
                          {activeGame.status}
                        </div>
                      </div>

                      {/* FAVORITE & SHARE BUTTONS */}
                      <div className="flex gap-2">
                        <button
                          onClick={() => toggleFavorite(activeGame)}
                          className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 border ${favorites.some(f => f.id === activeGame.id) ? 'bg-red-500/20 text-red-400 border-red-500/40' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-700'}`}
                        >
                          <i className="fa-solid fa-heart"></i>
                          {favorites.some(f => f.id === activeGame.id) ? 'Đã Yêu Thích' : 'Lưu Yêu Thích'}
                        </button>
                        <button
                          onClick={copyShareLink}
                          className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-bold transition-all"
                          title="Chia sẻ link"
                        >
                          <i className="fa-solid fa-share-nodes"></i>
                        </button>
                      </div>
                    </div>

                    {/* MAIN INFO DETAILS */}
                    <div className="md:col-span-8 lg:col-span-9 space-y-5">
                      
                      {/* BADGES & CONFIDENCE LEVEL */}
                      <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 pb-4">

                        <span className="font-black text-cyan-400 text-sm">{activeGame.ratings.audio} / 10</span>
                      </div>
                      <div className="flex justify-between items-center p-2.5 rounded-xl bg-slate-900 border border-slate-800">
                        <span className="text-slate-300">⚙️ Performance (Tối ưu - 15%)</span>
                        <span className="font-black text-cyan-400 text-sm">{activeGame.ratings.performance} / 10</span>
                      </div>
                      <div className="flex justify-between items-center p-2.5 rounded-xl bg-slate-900 border border-slate-800">
                        <span className="text-slate-300">🔁 Replayability (Giá trị chơi lại - 10%)</span>
                        <span className="font-black text-cyan-400 text-sm">{activeGame.ratings.replayability} / 10</span>
                      </div>
                      <div className="flex justify-between items-center p-2.5 rounded-xl bg-slate-900 border border-slate-800">
                        <span className="text-slate-300">💰 Value (Giá trị đầu tư - 20%)</span>
                        <span className="font-black text-cyan-400 text-sm">{activeGame.ratings.value} / 10</span>
                      </div>
                    </div>

                    <div className="p-4 rounded-2xl bg-cyan-950/40 border border-cyan-800/40 text-center">
                      <p className="text-[10px] uppercase font-bold text-slate-400">ĐÁNH GIÁ TỔNG QUAN TỪ AI</p>
                      <p className="text-xs text-slate-300 mt-1 italic">"{activeGame.verdict}"</p>
                    </div>
                  </div>

                </div>

                {/* 6. TRAILER & SCREENSHOTS */}
                <div className="glass-card rounded-3xl p-6 sm:p-8 space-y-6">
                  <h3 className="text-xl font-black text-white">🎬 MEDIA & HÌNH ẢNH GAME</h3>
                  
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    {/* VIDEO TRAILER */}
                    <div className="lg:col-span-7 rounded-2xl overflow-hidden border border-slate-800 bg-black aspect-video">
                      <iframe
                        src={activeGame.trailerUrl}
                        title="Game Trailer"
                        className="w-full h-full"
                        allowFullScreen
                      ></iframe>
                    </div>

                    {/* SCREENSHOTS GRID */}
                    <div className="lg:col-span-5 grid grid-cols-1 gap-4">
                      {activeGame.screenshots.map((img, idx) => (
                        <div key={idx} className="rounded-xl overflow-hidden border border-slate-800 group">
                          <img src={img} className="w-full h-auto object-cover group-hover:scale-105 transition-transform" alt="Screenshot" />
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

              </section>
            )}

            {/* OTHER TABS */}
            {activeTab === "DISCOVER" && (
              <section className="glass-card rounded-3xl p-6 sm:p-8 space-y-6 animate-fadeIn">
                <h3 className="text-2xl font-black text-white">🎲 KHÁM PHÁ CÁC TỰA GAME NỔI BẬT</h3>
                <p className="text-xs text-slate-400">Danh sách các tựa game được cộng đồng đánh giá cao nhất 2026.</p>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {PRESET_GAMES_DATABASE.map(game => (
                    <div
                      key={game.id}
                      onClick={() => { setActiveGame(game); setActiveTab("ANALYST"); addToHistory(game); }}
                      className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-cyan-500 transition-all cursor-pointer group"
                    >
                      <img src={game.coverImage} className="w-full h-48 object-cover group-hover:scale-105 transition-transform" alt={game.name} />
                      <div className="p-4 space-y-2">
                        <h4 className="font-bold text-white text-base">{game.name}</h4>
                        <p className="text-xs text-slate-400">{game.genres.join(", ")}</p>
                        <div className="flex justify-between items-center text-xs font-bold pt-2 border-t border-slate-800">
                          <span className="text-emerald-400">{formatPrice(game.steamPrice.current)}</span>
                          <span className="text-cyan-400">★ {calculateOverallScore(game.ratings)}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {activeTab === "FAVS" && (
              <section className="glass-card rounded-3xl p-6 sm:p-8 space-y-6 animate-fadeIn">
                <h3 className="text-2xl font-black text-white">❤️ GAME ĐÃ LƯU YÊU THÍCH</h3>
                {favorites.length === 0 ? (
                  <p className="text-sm text-slate-500 italic">Chưa có tựa game nào trong danh sách yêu thích.</p>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {favorites.map(fav => (
                      <div key={fav.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between gap-4">
                        <img src={fav.cover} className="w-16 h-16 object-cover rounded-xl" alt={fav.name} />
                        <div className="flex-1">
                          <h4 className="font-bold text-white text-sm">{fav.name}</h4>
                          <p className="text-xs text-cyan-400 font-bold">Điểm: {fav.rating} / 10</p>
                        </div>
                        <button onClick={() => toggleFavorite({ id: fav.id })} className="text-red-400 hover:text-red-300 p-2">
                          <i className="fa-solid fa-trash"></i>
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </section>
            )}

            {activeTab === "HISTORY" && (
              <section className="glass-card rounded-3xl p-6 sm:p-8 space-y-6 animate-fadeIn">
                <div className="flex justify-between items-center">
                  <h3 className="text-2xl font-black text-white">🕘 LỊCH SỬ TRA CỨU</h3>
                  {searchHistory.length > 0 && (
                    <button onClick={() => setSearchHistory([])} className="text-xs text-red-400 hover:underline">Xóa lịch sử</button>
                  )}
                </div>
                {searchHistory.length === 0 ? (
                  <p className="text-sm text-slate-500 italic">Chưa có lịch sử tìm kiếm.</p>
                ) : (
                  <div className="divide-y divide-slate-800">
                    {searchHistory.map((item, idx) => (
                      <div key={idx} className="py-3 flex items-center justify-between text-xs text-slate-300">
                        <span className="font-bold text-white">{item.name}</span>
                        <span className="text-slate-500">{item.date}</span>
                      </div>
                    ))}
                  </div>
                )}
              </section>
            )}

          </main>

          {/* CUSTOM NOTIFICATION MODAL */}
          {showModalMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-cyan-950 border border-cyan-500 text-cyan-200 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs font-bold animate-bounce">
              <i className="fa-solid fa-circle-check text-cyan-400 text-lg"></i>
              <span>{showModalMsg}</span>
              <button onClick={() => setShowModalMsg(null)} className="ml-2 text-slate-400 hover:text-white">✕</button>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800 bg-slate-950 py-8 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 space-y-3">
              <p className="font-bold text-slate-400 text-sm">
                © 2026 GAME ANALYST HUB – TRUNG HẬU
              </p>
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-cyan-400 font-semibold text-[11px]">
                <i className="fa-solid fa-code"></i> Created & Developed by Trung Hậu
              </div>
              <p className="text-[11px]">
                Nguồn dữ liệu tham chiếu chính thức từ <a href="https://store.steampowered.com/" target="_blank" className="underline text-slate-400">Steam Store</a> & <a href="https://store.epicgames.com/" target="_blank" className="underline text-slate-400">Epic Games Store</a>.
              </p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
